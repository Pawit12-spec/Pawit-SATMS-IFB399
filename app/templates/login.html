<!DOCTYPE html>
<html data-theme="light">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <script>
      (function () {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='globals.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}" />
    <title>Login | Substation Dashboard</title>
  </head>

  <body class="login-body">
    <div class="login-container">
      <div class="login-card">
        <img src="{{ url_for('static', filename='img/energy-queensland-logo-208x20.svg') }}" class="login-logo" />
        <h1 class="login-title">Substation Dashboard</h1>

        {% if error %}
        <div class="login-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('main.login') }}">
          <div class="login-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autofocus />
          </div>
          <div class="login-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
          </div>
          <button type="submit" class="login-btn">Sign In</button>
        </form>
      </div>
    </div>
  </body>
</html>
